name: update rankings

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "teams/**"
  schedule:
    - cron: "0 11 * * *"   # every day at 7am Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests lxml
      - name: Save WrestleStat snapshot (once a day)
        run: python -m teams.wrestlestat
      - name: Pull new results from enabled sources
        run: python -m teams.fetch
      - name: Re-rank teams
        run: python -m teams.rank
      - name: Commit updated rankings
        run: |
          git config user.name "rankings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md rankings data/duals data/wrestlestat
          git diff --cached --quiet || (git commit -m "Update team rankings" && git push)
