version: 2
models:
  - name: stg_matches
    columns:
      - name: match_id
        tests: [unique, not_null]
      - name: result_type
        tests:
          - accepted_values:
              values: ['DEC', 'MD', 'TF', 'FALL', 'FOR', 'INJ', 'DQ']
      - name: event_type
        tests:
          - accepted_values:
              values: ['dual', 'tournament']
